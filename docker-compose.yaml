services:
  queue:
    image: rabbitmq:3-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
  processor:
    environment:
      CORE_CONFIG_FILE: src/config/settings-test-compose.ini
    build: .
    container_name: processor
    command: ["python", "src/worker.py"]
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import cv2, mediapipe as mp, numpy as np; cv2.cvtColor(np.zeros((1,1,3),dtype=np.uint8), cv2.COLOR_BGR2GRAY); mp.solutions.hands.Hands()\""]
      interval: 5s
      timeout: 5s
      retries: 1